<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeLive · DB Explorer</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --plane: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --hover: rgba(11, 11, 11, 0.04);
    --series-1: #2a78d6;
    --good: #0ca30c;
    --critical: #d03b3b;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
    --label-w: 148px;
    --gutter: 52px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --plane: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --hover: rgba(255, 255, 255, 0.06);
      --series-1: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --plane: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.06);
    --series-1: #3987e5;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--text-primary);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 24px 64px; }

  /* ---- header ---- */
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-muted); font-size: 13px; margin: 2px 0 0; }
  .spacer { flex: 1 1 auto; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
    background: var(--surface-1); border: 1px solid var(--border); color: var(--text-secondary);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .pill svg { flex: none; }
  button {
    font: inherit; font-size: 13px; color: var(--text-secondary);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { background: var(--hover); color: var(--text-primary); }

  /* ---- cards ---- */
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .card h2 {
    font-size: 14px; font-weight: 600; margin: 0 0 2px;
  }
  .card .cap { font-size: 12.5px; color: var(--text-muted); margin: 0 0 20px; }

  /* ---- KPI row ---- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi .label { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; }
  .kpi .value { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .kpi .note { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* ---- bar chart ---- */
  .chart { position: relative; margin-top: 4px; }
  .rows { position: relative; }
  .gridlines { position: absolute; left: var(--label-w); right: var(--gutter); top: 0; bottom: 0; pointer-events: none; }
  .gridlines i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grid); }
  .gridlines i.zero { background: var(--axis); }
  .bar-row {
    position: relative; display: grid; grid-template-columns: var(--label-w) 1fr;
    align-items: center; height: 34px; border-radius: 6px;
  }
  .bar-row:hover { background: var(--hover); }
  .bar-label {
    font-size: 12.5px; color: var(--text-secondary); padding-right: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bar-track { position: relative; padding-right: var(--gutter); height: 100%; }
  .bar-inner { position: relative; height: 100%; display: flex; align-items: center; }
  .bar-fill {
    height: 20px; background: var(--series-1);
    border-radius: 0 4px 4px 0; min-width: 0;
  }
  .bar-value {
    position: absolute; top: 50%; transform: translateY(-50%);
    margin-left: 9px; font-size: 12.5px; color: var(--text-secondary);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .bar-value.zero { color: var(--text-muted); }
  .axis { position: relative; height: 20px; margin-top: 4px; }
  .axis .ticks { position: absolute; left: var(--label-w); right: var(--gutter); top: 0; }
  .axis span {
    position: absolute; transform: translateX(-50%); font-size: 11.5px;
    color: var(--text-muted); font-variant-numeric: tabular-nums;
  }

  /* ---- browser ---- */
  .browser { display: grid; grid-template-columns: 232px 1fr; gap: 16px; margin-top: 18px; align-items: start; }
  .rail { padding: 12px; }
  .rail-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 7px 9px; border-radius: 7px; cursor: pointer;
    background: none; border: 1px solid transparent; text-align: left;
    font-size: 13px; color: var(--text-secondary);
  }
  .rail-item:hover { background: var(--hover); }
  .rail-item[aria-current="true"] {
    background: var(--hover); color: var(--text-primary); font-weight: 500;
    border-color: var(--border);
  }
  .rail-item .n { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail-item .c { font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: 4px; margin-bottom: 14px; }
  .tabs button[aria-selected="true"] { color: var(--text-primary); font-weight: 500; background: var(--hover); }

  .tbl-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 9px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td {
    text-align: left; padding: 8px 12px; white-space: nowrap;
    border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums;
  }
  th { color: var(--text-secondary); font-weight: 600; background: var(--plane); position: sticky; top: 0; }
  td { color: var(--text-secondary); font-family: var(--mono); font-size: 12px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--hover); }
  .null { color: var(--text-muted); font-style: italic; }
  .empty { padding: 28px; text-align: center; color: var(--text-muted); font-size: 13px; }

  /* ---- console ---- */
  .console { margin-top: 16px; }
  textarea {
    width: 100%; min-height: 88px; resize: vertical; font: 12.5px/1.6 var(--mono);
    color: var(--text-primary); background: var(--plane);
    border: 1px solid var(--border); border-radius: 9px; padding: 12px;
  }
  textarea:focus { outline: 2px solid var(--series-1); outline-offset: -1px; }
  .console-bar { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .err {
    color: var(--critical); font-family: var(--mono); font-size: 12px;
    padding: 12px; border: 1px solid var(--border); border-radius: 9px; white-space: pre-wrap;
  }

  /* ---- tooltip ---- */
  #tip {
    position: fixed; z-index: 20; pointer-events: none; opacity: 0;
    transition: opacity .12s; background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px;
    font-size: 12.5px; color: var(--text-primary);
    box-shadow: 0 4px 16px rgba(0,0,0,.14);
  }
  #tip .t { color: var(--text-muted); font-size: 11.5px; }
  @media (max-width: 820px) {
    .browser { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>VibeLive · DB Explorer</h1>
      <p class="sub" id="sub">Connecting…</p>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="status"><span class="dot"></span><span>Checking…</span></span>
    <button id="theme" title="Toggle light / dark">◐ Theme</button>
    <button id="refresh">↻ Refresh</button>
  </header>

  <div id="fatal" style="display:none" class="card err"></div>

  <section class="kpis" id="kpis"></section>

  <section class="card">
    <h2>Rows by table</h2>
    <p class="cap">Live row counts across all 9 tables in the <code>public</code> schema.</p>
    <div class="chart" id="chart"></div>
  </section>

  <section class="browser">
    <div class="card rail" id="rail"></div>
    <div class="card">
      <div class="tabs">
        <button id="tab-data" aria-selected="true">Data</button>
        <button id="tab-schema" aria-selected="false">Schema</button>
      </div>
      <div id="detail"><div class="empty">Select a table.</div></div>
    </div>
  </section>

  <section class="card console">
    <h2>Query console</h2>
    <p class="cap">Runs on a read-only connection — writes are rejected by Postgres.</p>
    <textarea id="sql" spellcheck="false">SELECT c.name AS category, count(h.id) AS activity_rows
FROM categories c
LEFT JOIN human_activity h ON h.category_id = c.id
GROUP BY c.name
ORDER BY activity_rows DESC;</textarea>
    <div class="console-bar">
      <button id="run">▶ Run query</button>
      <span class="cap" style="margin:0">⌘/Ctrl + Enter</span>
    </div>
    <div id="qout"></div>
  </section>
</div>

<div id="tip"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString();
let state = { tables: [], active: null, tab: 'data' };

/* ---------- theme ---------- */
$('#theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};

/* ---------- tooltip ---------- */
const tip = $('#tip');
function showTip(html, e) {
  tip.innerHTML = html;
  tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height - 10;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y < 8) y = e.clientY + 18;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => tip.style.opacity = 0;

/* ---------- nice axis ---------- */
function niceScale(max, target = 4) {
  if (!(max > 0)) return { max: 1, ticks: [0, 1] };
  const raw = max / target;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let t = 0; t <= top + 1e-9; t += step) ticks.push(Math.round(t * 1e6) / 1e6);
  return { max: top, ticks };
}

/* ---------- chart ---------- */
function drawChart(tables) {
  const el = $('#chart');
  if (!tables.length) { el.innerHTML = '<div class="empty">No tables found.</div>'; return; }
  const { max, ticks } = niceScale(Math.max(...tables.map(t => t.rows)));

  const grid = ticks.map(t =>
    `<i class="${t === 0 ? 'zero' : ''}" style="left:${(t / max) * 100}%"></i>`).join('');

  const rows = tables.map(t => {
    const pct = (t.rows / max) * 100;
    return `<div class="bar-row" data-name="${esc(t.name)}" data-rows="${t.rows}">
      <div class="bar-label" title="${esc(t.name)}">${esc(t.name)}</div>
      <div class="bar-track"><div class="bar-inner">
        <div class="bar-fill" style="width:${pct}%"></div>
        <span class="bar-value ${t.rows ? '' : 'zero'}" style="left:${pct}%">${fmt(t.rows)}</span>
      </div></div>
    </div>`;
  }).join('');

  el.innerHTML = `<div class="rows"><div class="gridlines">${grid}</div>${rows}</div>
    <div class="axis"><div class="ticks">${
      ticks.map(t => `<span style="left:${(t / max) * 100}%">${fmt(t)}</span>`).join('')
    }</div></div>`;

  el.querySelectorAll('.bar-row').forEach(r => {
    r.onmousemove = e => showTip(
      `<div>${esc(r.dataset.name)}</div>
       <div class="t">${fmt(+r.dataset.rows)} row${+r.dataset.rows === 1 ? '' : 's'}</div>`, e);
    r.onmouseleave = hideTip;
    r.onclick = () => selectTable(r.dataset.name);
  });
}

/* ---------- overview ---------- */
async function loadOverview() {
  const d = await (await fetch('/api/explorer/overview')).json();
  const ok = d.connected;

  $('#status').innerHTML = ok
    ? `<span class="dot" style="background:var(--good)"></span><span>✓ Connected</span>`
    : `<span class="dot" style="background:var(--critical)"></span><span>✕ Disconnected</span>`;
  $('#sub').textContent = ok
    ? `${d.database} · ${d.server} · localhost:5432`
    : 'Could not reach Postgres on localhost:5432';

  if (!ok) {
    $('#fatal').style.display = 'block';
    $('#fatal').textContent = d.error + '\n\nIs the container up?  docker compose up -d';
    $('#kpis').innerHTML = ''; $('#chart').innerHTML = ''; $('#rail').innerHTML = '';
    return;
  }
  $('#fatal').style.display = 'none';
  state.tables = d.tables;

  const withRows = d.tables.filter(t => t.rows > 0).length;
  $('#kpis').innerHTML = [
    ['Tables', fmt(d.tables.length), `${withRows} with data, ${d.tables.length - withRows} empty`],
    ['Total rows', fmt(d.total_rows), 'across every table'],
    ['Database size', d.size, 'on disk, incl. indexes'],
  ].map(([l, v, n]) => `<div class="card kpi">
      <div class="label">${l}</div><div class="value">${esc(v)}</div><div class="note">${esc(n)}</div>
    </div>`).join('');

  drawChart(d.tables);

  $('#rail').innerHTML = d.tables.map(t =>
    `<button class="rail-item" data-name="${esc(t.name)}" aria-current="${t.name === state.active}">
       <span class="n">${esc(t.name)}</span><span class="c">${fmt(t.rows)}</span>
     </button>`).join('');
  $('#rail').querySelectorAll('.rail-item').forEach(b =>
    b.onclick = () => selectTable(b.dataset.name));

  if (!state.active) selectTable(d.tables.find(t => t.rows > 0)?.name || d.tables[0]?.name);
}

/* ---------- table detail ---------- */
function cell(v) {
  if (v === null) return '<span class="null">NULL</span>';
  if (typeof v === 'object') return esc(JSON.stringify(v));
  return esc(v);
}
function tableHTML(fields, rows) {
  if (!rows.length) return '<div class="empty">No rows yet.</div>';
  return `<div class="tbl-scroll"><table>
    <thead><tr>${fields.map(f => `<th>${esc(f)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(v => `<td>${cell(v)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

async function selectTable(name) {
  if (!name) return;
  state.active = name;
  document.querySelectorAll('.rail-item').forEach(b =>
    b.setAttribute('aria-current', b.dataset.name === name));
  const d = await (await fetch(`/api/explorer/tables/${encodeURIComponent(name)}`)).json();
  state.detail = d;
  renderDetail();
}

function renderDetail() {
  const d = state.detail;
  if (!d) return;
  $('#detail').innerHTML = state.tab === 'data'
    ? tableHTML(d.fields, d.rows) +
      `<p class="cap" style="margin:12px 0 0">${d.name} · showing ${d.rows.length} row${d.rows.length === 1 ? '' : 's'}${d.rows.length >= d.limit ? ` (capped at ${d.limit})` : ''}</p>`
    : tableHTML(['column', 'type', 'nullable', 'default'],
        d.columns.map(c => [c.name, c.type, c.nullable ? 'yes' : 'no', c.default]));
}
$('#tab-data').onclick = () => setTab('data');
$('#tab-schema').onclick = () => setTab('schema');
function setTab(t) {
  state.tab = t;
  $('#tab-data').setAttribute('aria-selected', t === 'data');
  $('#tab-schema').setAttribute('aria-selected', t === 'schema');
  renderDetail();
}

/* ---------- console ---------- */
async function runQuery() {
  const out = $('#qout');
  out.innerHTML = '<div class="empty">Running…</div>';
  const res = await fetch('/api/explorer/query', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sql: $('#sql').value }),
  });
  const d = await res.json();
  if (!res.ok) { out.innerHTML = `<div class="err">${esc(d.detail)}</div>`; return; }
  out.innerHTML = d.fields.length
    ? tableHTML(d.fields, d.rows) + `<p class="cap" style="margin:12px 0 0">${d.rows.length} row${d.rows.length === 1 ? '' : 's'}</p>`
    : `<div class="empty">${esc(d.message || 'No result set.')}</div>`;
}
$('#run').onclick = runQuery;
$('#sql').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runQuery(); }
});
$('#refresh').onclick = loadOverview;

loadOverview();
</script>
</body>
</html>
